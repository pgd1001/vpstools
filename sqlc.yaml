version: "2"
sql:
  - engine: "postgresql"
    queries: "packages/db/queries"
    schema: "migrations/postgres"
    gen:
      go:
        package: "db"
        out: "packages/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
