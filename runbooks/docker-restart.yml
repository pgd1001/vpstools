apiVersion: vps-tools.io/v1
kind: Runbook
metadata:
  name: docker-restart
  title: Docker Daemon Restart
  description: |
    Restarts the Docker daemon with a graceful drain and health check.
    Drains running containers by stopping them first (opt-in), restarts
    dockerd, then restarts containers. Use `drain_containers=false` to
    skip container stop (faster, but containers restart on daemon come-up).
  risk: high
  tags: ["recovery", "docker", "daemon", "restart", "containers"]
  version: 1
spec:
  parameters:
    - name: drain_containers
      type: string
      default: "true"
      description: Stop all containers before restart (true/false)
    - name: restart_timeout_seconds
      type: string
      default: "30"
      description: Max seconds to wait for dockerd restart
    - name: healthcheck_url
      type: string
      default: "http://localhost/health"
      description: Health endpoint to verify
    - name: reason
      type: string
      default: ""
      description: Required reason for this action
    - name: schedule
      type: string
      default: "on-demand"
      description: Recommended cadence
  targets:
    allowedEnvironments: ["development", "staging", "production"]
  approval:
    required: true
    requiredRoles: ["admin", "senior_engineer"]
  execution:
    shell: /bin/bash
    sudo: true
    timeoutSeconds: 120
    concurrency: 1
    command: |
      set -euo pipefail

      DRAIN="${DRAIN_CONTAINERS:-true}"
      TIMEOUT="${RESTART_TIMEOUT_SECONDS:-30}"
      HEALTHCHECK="${HEALTHCHECK_URL:-http://localhost/health}"

      echo "=========================================="
      echo "  DOCKER DAEMON RESTART"
      echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
      echo "  Host: $(hostname)"
      echo "=========================================="
      echo ""

      if ! command -v docker &>/dev/null; then
        echo "Docker is not installed."
        exit 1
      fi

      echo "--- PRE-RESTART STATE ---"
      docker info --format 'Containers: {{.ContainersRunning}} running, {{.ContainersPaused}} paused' 2>/dev/null || true
      echo ""

      if [ "$DRAIN" = "true" ]; then
        echo "--- DRAINING CONTAINERS ---"
        running=$(docker ps -q 2>/dev/null | wc -l)
        if [ "$running" -gt 0 ]; then
          echo "Stopping $running running container(s)..."
          docker stop $(docker ps -q) 2>&1
          echo "All containers stopped."
        else
          echo "No running containers to drain."
        fi
      else
        echo "--- SKIPPING DRAIN (drain_containers=false) ---"
        echo "Containers will restart automatically with dockerd."
      fi
      echo ""

      echo "--- RESTARTING DOCKER DAEMON ---"
      systemctl daemon-reload 2>/dev/null || true
      systemctl restart docker 2>&1

      echo "Waiting for dockerd (max ${TIMEOUT}s)..."
      for i in $(seq 1 "$TIMEOUT"); do
        if docker info &>/dev/null 2>&1; then
          echo "Docker daemon is ready (after ${i}s)."
          break
        fi
        sleep 1
        if [ "$i" -eq "$TIMEOUT" ]; then
          echo "ERROR: Docker daemon failed to start within ${TIMEOUT}s."
          systemctl status docker --no-pager 2>/dev/null | tail -20
          journalctl -u docker --since "5 minutes ago" --no-pager 2>/dev/null | tail -20
          exit 1
        fi
      done
      echo ""

      echo "--- POST-RESTART STATE ---"
      docker info --format 'Server: {{.ServerVersion}}, Containers: {{.ContainersRunning}} running' 2>/dev/null || true
      echo ""

      echo "--- HEALTH CHECK ---"
      echo "Testing: $HEALTHCHECK"
      for i in 1 2 3; do
        code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 -m 5 "$HEALTHCHECK" 2>/dev/null || echo "FAIL")
        if [ "$code" != "FAIL" ] && [ "$code" != "000" ]; then
          echo "  HTTP $code (attempt $i)"
          echo "Health check passed."
          break
        fi
        [ "$i" -lt 3 ] && echo "  Retrying..." && sleep 5
      done

      echo ""
      echo "Docker daemon restart complete."
  output:
    store: inline
    redact: []
