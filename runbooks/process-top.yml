apiVersion: vps-tools.io/v1
kind: Runbook
metadata:
  name: process-top
  title: Top Processes Report
  description: |
    Reports top CPU and memory consuming processes, zombie process
    count, total process count, file descriptor usage, and load
    trend over the last minute. Safe read-only diagnostic.
  risk: low
  tags: ["diagnostic", "process", "performance", "monitor"]
  version: 1
spec:
  parameters:
    - name: top_n
      type: string
      default: "15"
      description: Number of top processes per category
    - name: healthcheck_url
      type: string
      default: ""
      description: Health endpoint to verify
    - name: reason
      type: string
      default: ""
      description: Reason for production runs
    - name: schedule
      type: string
      default: "on-demand"
      description: Recommended cadence
  targets:
    allowedEnvironments: ["development", "staging", "production"]
  approval:
    required: false
  execution:
    shell: /bin/bash
    sudo: true
    timeoutSeconds: 30
    concurrency: 10
    command: |
      set -euo pipefail

      TOP_N="${TOP_N:-15}"

      echo "=========================================="
      echo "  TOP PROCESSES REPORT"
      echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
      echo "=========================================="
      echo ""

      echo "--- OVERVIEW ---"
      total=$(ps aux | wc -l)
      running=$(ps aux | grep -c "Rl\|R+")
      zombies=$(ps aux | awk '{print $8}' | grep -c "Z")
      echo "Total processes:   $total"
      echo "Running/Runnable:  $running"
      echo "Zombie processes:  $zombies"
      echo ""

      echo "--- TOP $TOP_N BY CPU ---"
      ps aux --sort=-%cpu 2>/dev/null || ps aux -r 2>/dev/null || top -b -n 1 -o %CPU 2>/dev/null | head -$((TOP_N + 7))
      ps aux --sort=-%cpu 2>/dev/null | head -$((TOP_N + 1)) || true
      echo ""

      echo "--- TOP $TOP_N BY MEMORY ---"
      ps aux --sort=-%mem 2>/dev/null | head -$((TOP_N + 1)) || true
      echo ""

      echo "--- ZOMBIE PROCESSES ---"
      zombies_found=$(ps aux | awk '{print $8}' | grep "^Z" | wc -l)
      if [ "$zombies_found" -gt 0 ]; then
        ps aux | awk '$8 ~ /^Z/ {print $2, $11, $12, $13}'
      else
        echo "(none)"
      fi
      echo ""

      echo "--- FILE DESCRIPTORS ---"
      if [ -d /proc/sys/fs ]; then
        echo "Max FD:    $(cat /proc/sys/fs/file-max 2>/dev/null || echo '?')"
        echo "Open FD:   $(cat /proc/sys/fs/file-nr 2>/dev/null | awk '{print $1}' || echo '?')"
      fi
      echo ""

      echo "--- LOAD AVERAGE ---"
      uptime
      echo ""

      echo "--- THREADS ---"
      if command -v ps &>/dev/null; then
        echo "Total threads: $(ps -eLf 2>/dev/null | wc -l || echo '?')"
      fi
  output:
    store: inline
    redact: []
