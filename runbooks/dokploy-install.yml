apiVersion: vps-tools.io/v1
kind: Runbook
metadata:
  name: dokploy-install
  title: Dokploy Deployment Platform
  description: |
    Installs Dokploy — an open-source Vercel/Heroku alternative — using
    the official install script. Sets up Docker, Traefik reverse proxy,
    and the Dokploy dashboard on port 3000.
    Requires a domain with DNS pointed at this server for SSL.
  risk: high
  tags: ["provisioning", "dokploy", "deployment", "paas", "docker"]
  version: 1
spec:
  parameters:
    - name: domain
      type: string
      default: ""
      required: true
      description: Domain pointed at this server for Dokploy dashboard
    - name: email
      type: string
      default: ""
      required: true
      description: Email for Let's Encrypt SSL certificates
    - name: node_version
      type: string
      default: "22"
      description: Node.js major version for build-time containers
  targets:
    allowedTags:
      os: ubuntu
    allowedEnvironments: ["development", "staging"]
  approval:
    required: true
    environment: production
    requiredRole: senior_engineer
  execution:
    shell: /bin/bash
    sudo: true
    timeoutSeconds: 900
    concurrency: 1
    command: |
      set -euo pipefail

      DOMAIN="${DOMAIN:?domain is required}"
      EMAIL="${EMAIL:?email is required}"
      NODE_VERSION="${NODE_VERSION:-22}"

      echo "=== [1/4] System dependencies ==="
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y -qq \
        curl wget git ufw ca-certificates \
        gnupg lsb-release

      echo "=== [2/4] Docker Engine ==="
      if ! command -v docker &>/dev/null; then
        curl -fsSL https://get.docker.com | bash
      fi
      systemctl enable --now docker
      apt-get install -y -qq docker-compose-plugin

      echo "=== [3/4] UFW: open 80, 443, 3000 ==="
      ufw allow 80/tcp comment 'HTTP'
      ufw allow 443/tcp comment 'HTTPS'
      ufw allow 3000/tcp comment 'Dokploy'
      ufw --force enable

      echo "=== [4/4] Install Dokploy ==="
      if [ ! -f /etc/dokploy/.env ]; then
        curl -fsSL https://dokploy.com/install.sh | bash
      fi

      cd /etc/dokploy
      if [ -f docker-compose.yml ]; then
        docker compose pull
        docker compose up -d
      fi

      echo "=== DOKPLOY SETUP COMPLETE ==="
      echo "Dashboard: https://$DOMAIN"
      echo "Initial setup: open in browser, create admin account"
  output:
    store: inline
    redact: ["${DOMAIN}", "${EMAIL}"]
