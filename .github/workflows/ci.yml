name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go test ./... -race -count=1

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go vet ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: GOTOOLCHAIN=go1.26.5 go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: GOTOOLCHAIN=go1.26.5 govulncheck ./...

  runbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Validate every runbook template
        run: go test ./runbooks -count=1

  self-contained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Build self-contained binaries
        run: |
          mkdir -p bin
          go build -o bin/api ./apps/api
          go build -o bin/runner ./apps/runner
          go build -o bin/backup ./apps/api/cmd/backup
          go build -o bin/vps ./apps/cli
      - name: Run self-contained smoke and restore test
        run: sh ./scripts/self-contained-smoke.sh
      - name: Validate Linux deployment scripts
        run: |
          sh -n scripts/*.sh

  self-contained-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: anchore/sbom-action/download-syft@v0.24.0
        with:
          syft-version: v1.44.0
      - name: Build Windows self-contained binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          go build -o bin/api.exe ./apps/api
          go build -o bin/runner.exe ./apps/runner
          go build -o bin/backup.exe ./apps/api/cmd/backup
          go build -o bin/vps.exe ./apps/cli
      - name: Run Windows self-contained smoke and restore test
        shell: pwsh
        run: ./scripts/self-contained-smoke.ps1

  packaged-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.0
          install-only: true
      - name: Build Windows release archive
        shell: pwsh
        run: goreleaser release --snapshot --clean --skip=sbom
      - name: Validate and run packaged Windows smoke
        shell: pwsh
        run: |
          ./scripts/validate-release-layout.ps1 -DistDirectory dist
          $windowsArchive = Get-ChildItem dist -Filter '*windows_amd64.zip' | Select-Object -First 1
          if (-not $windowsArchive) { throw 'Windows amd64 release archive is missing' }
          $packageDir = Join-Path $env:RUNNER_TEMP 'vps-tools-packaged-windows'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Expand-Archive -LiteralPath $windowsArchive.FullName -DestinationPath $packageDir -Force
          ./scripts/self-contained-smoke.ps1 `
            -ApiBinary (Join-Path $packageDir 'api.exe') `
            -RunnerBinary (Join-Path $packageDir 'runner.exe') `
            -BackupBinary (Join-Path $packageDir 'backup.exe') `
            -CliBinary (Join-Path $packageDir 'vps.exe')

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run smoke

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        working-directory: apps/web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Check web package
        working-directory: apps/web
        run: |
          npm audit --omit=optional
          npm run lint --if-present
          npm run typecheck --if-present
          npm run build
      - name: Run browser web smoke
        working-directory: apps/web
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          npm run start > "$RUNNER_TEMP/vps-tools-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000 >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000 >/dev/null || { cat "$RUNNER_TEMP/vps-tools-web.log"; exit 1; }
          WEB_BASE_URL=http://127.0.0.1:3000 npm run smoke
          kill "$web_pid" || true
          wait "$web_pid" || true
          trap - EXIT
          NEXT_PUBLIC_DEV_AUTH=true npm run build
          NEXT_PUBLIC_DEV_AUTH=true VPS_DEV_AUTH=true npx next start -p 3001 > "$RUNNER_TEMP/vps-tools-web-dev-auth.log" 2>&1 &
          dev_web_pid=$!
          trap 'kill "$dev_web_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3001 >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001 >/dev/null || { cat "$RUNNER_TEMP/vps-tools-web-dev-auth.log"; exit 1; }
          EXPECT_DEV_AUTH=true WEB_BASE_URL=http://127.0.0.1:3001 npm run smoke

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.0
          install-only: true
      - uses: anchore/sbom-action/download-syft@v0.24.0
        with:
          syft-version: v1.44.0
      - run: goreleaser check
      - run: goreleaser release --snapshot --clean
      - name: Verify packaged installation layout
        run: sh ./scripts/validate-release-layout.sh dist
      - name: Verify release evidence
        run: sh ./scripts/validate-release.sh dist
      - name: Run packaged Linux self-contained smoke
        run: |
          archive=$(find dist -maxdepth 1 -type f -name '*linux_amd64.tar.gz' | head -n 1)
          test -n "$archive"
          package_dir="$RUNNER_TEMP/vps-tools-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          tar -xzf "$archive" -C "$package_dir"
          sh -n "$package_dir"/scripts/*.sh
          API_BINARY="$package_dir/api" \
          RUNNER_BINARY="$package_dir/runner" \
          BACKUP_BINARY="$package_dir/backup" \
          CLI_BINARY="$package_dir/vps" \
          sh ./scripts/self-contained-smoke.sh
