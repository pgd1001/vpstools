global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/vps-tools-alerts.yml

scrape_configs:
  - job_name: vps-tools-api
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8080']
  - job_name: vps-tools-runner
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9091']
