services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: svrtools
      POSTGRES_PASSWORD: svrtools
      POSTGRES_DB: svrtools
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ssh-target:
    build:
      context: ./ssh-target
    ports:
      - "2222:22"
    # These configure the throwaway target container's own account. The runner
    # no longer reads a fleet-wide SSH_PASSWORD: it resolves a per-server
    # credential from SSH_CREDENTIALS_DIR and pins the host key recorded when
    # the server was registered.
    environment:
      SSH_USER: svrtools
      SSH_PASSWORD: svrtools

volumes:
  pgdata:
